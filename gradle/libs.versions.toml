[versions]
agp = "8.13.1"
kotlin = "2.2.10"
coreKtx = "1.17.0"
activityCompose = "1.12.2"
lifecycle = "2.10.0"
composeBom = "2025.12.01"
# 2.9.x: the latest line built for Compose 1.10 / activity 1.12 (2.10 pulls newer Compose and activity).
navigationCompose = "2.9.8"
junit = "4.13.2"
# 3.25.x: the protobuf-javalite runtime Firebase Firestore 26.x is built against (4.x breaks its gencode).
protobuf = "3.25.5"
protobufPlugin = "0.10.0"
healthConnect = "1.1.0"
# Cloud account / ads / billing. Newer majors (Firebase BoM 35 -> firebase-auth 25, googleid 1.2.1)
# ship Kotlin 2.4 metadata, which the Kotlin 2.2 compiler cannot read.
firebaseBom = "34.19.0"
googleServices = "4.5.0"
credentials = "1.6.0"
googleId = "1.2.0"
coroutinesPlayServices = "1.10.2"
playServicesAds = "25.5.0"
ump = "4.0.0"
billing = "9.1.0"
# Google Play's in-app rating card. Plain Java artifact, no -ktx: newer Play libraries may carry Kotlin
# metadata this compiler cannot read (see above); kotlinx-coroutines-play-services awaits its Tasks.
playReview = "2.0.2"
# Comida: on-device food recognizer (TensorFlow Lite runtime, classic Interpreter API; 2.x is the new
# CompiledModel API) and barcode decoding from a photo.
litert = "1.4.2"
zxing = "3.5.3"
# Comida 1.8.0: text recognition of a package photo (ML Kit v2, Latin script) through Google Play services
# (unbundled: ~260 KB; the model is downloaded once by Play services). Java-only artifacts (no Kotlin metadata).
mlkitTextRecognition = "19.0.2"
# The same for Chinese, Japanese, Korean and Devanagari packages (about 50 KB each; each also reads Latin).
mlkitTextRecognitionScripts = "16.0.2"
# Unit tests only: runs the food database schema on a real SQLite (the version AGP already ships).
sqliteJdbc = "3.41.2.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobuf" }
protobuf-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }
androidx-health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesPlayServices" }
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
play-review = { group = "com.google.android.play", name = "review", version.ref = "playReview" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
mlkit-text-recognition = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition", version.ref = "mlkitTextRecognition" }
mlkit-text-recognition-chinese = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-chinese", version.ref = "mlkitTextRecognitionScripts" }
mlkit-text-recognition-japanese = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-japanese", version.ref = "mlkitTextRecognitionScripts" }
mlkit-text-recognition-korean = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-korean", version.ref = "mlkitTextRecognitionScripts" }
mlkit-text-recognition-devanagari = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition-devanagari", version.ref = "mlkitTextRecognitionScripts" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
