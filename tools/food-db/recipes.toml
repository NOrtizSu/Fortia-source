# Dishes made of ingredients. Two kinds of entries, both [<food id>]:
#  - recipe dishes (mapping.txt source = recipe): the dish's values are computed from the ingredients;
#  - typical recipes of USDA/CIQUAL dishes (mapping.txt has a source code): the values stay the source's, the
#    ingredients only tell the app what the user can adjust (validate.py checks that they explain the energy within
#    25%), and `fill=recipe` in mapping.txt can borrow from them the nutrients the source lacks.
# Every entry with `list` (default true) goes to app/src/main/assets/food/recipes.tsv as grams per 100 g of the
# finished dish (contract 3); the app applies ingredient changes as deltas.
#
# name        = short description (copied to mapping.txt's description column for recipe dishes)
# yield       = finished weight / total weight of the ingredients (default 1.0): water lost when cooking (< 1)
#               or absorbed (> 1). Nutrients are kept; only the weight changes.
# ingredients = [[food id, amount, "what"(, adjustable 0/1)], ...]: a catalog food (mapping.txt id) in its own unit
#               (grams, or ml for ml foods such as milk, water or wine) as weighed for the whole recipe, raw or cooked
#               as that food is; adjustable defaults to 1 except water, salt, spices (build.NOT_ADJUSTABLE).
#               Recipes with list = false may also use USDA/CIQUAL source keys (fdc:<id>, ciqual:<code>) directly.
#               Values per 100 g of the finished dish = sum(nutrients x amount / 100) / (total weight x yield).
# list        = false: values only, not offered for adjusting (e.g. an estimate from two cuts of ham)
# expand      = true: ingredients that are themselves recipe dishes are listed as their own ingredients
# basis       = where the amounts come from
#
# Amounts are typical home recipes (our own composition of standard Spanish recipes); the nutrient values come only
# from the USDA/CIQUAL foods behind each catalog food.

# --- Drinks (ml dishes: per 100 g, then mapping.txt's density; ml ingredients in ml) ---

