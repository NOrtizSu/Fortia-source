# Recipes for foods that neither USDA FoodData Central nor CIQUAL has as such (mapping.txt source = recipe).
#
# [<food id>]
# name        = short description (copied to mapping.txt's description column)
# yield       = finished weight / total weight of the ingredients (default 1.0): water lost when cooking (< 1)
#               or absorbed (> 1). Nutrients are kept; only the weight changes.
# ingredients = [[source key, grams, "what"], ...]: grams as weighed for the whole recipe (raw unless the source
#               is a cooked food). Values per 100 g of the finished dish = sum(nutrients x grams / 100) / (total x yield).
# basis       = where the amounts come from
#
# Amounts are typical home recipes (our own composition of standard Spanish recipes); the nutrient values come only
# from the USDA/CIQUAL foods named in each line.

# --- Drinks (ml converted to g; mapping.txt adds the density) ---

